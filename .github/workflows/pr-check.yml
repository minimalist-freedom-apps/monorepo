name: Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node + pnpm + install
        uses: ./.github/actions/setup-node-pnpm

      - name: Check lockfile install
        run: pnpm install --frozen-lockfile

      - name: Check (format, organize imports)
        run: pnpm check

      - name: Lint (biome + eslint)
        run: pnpm lint

      - name: Run Knip
        run: pnpm knip

      - name: TypeScript check
        run: pnpm exec nx affected -t typecheck --base=${{ github.event.pull_request.base.sha || github.event.before }} --head=${{ github.sha }} --parallel=3 --output-style=stream --verbose

      - name: Verify requirements
        run: pnpm requirements:verify

      - name: Run affected unit tests (Vitest targets)
        run: pnpm exec nx affected -t test --base=${{ github.event.pull_request.base.sha || github.event.before }} --head=${{ github.sha }} --parallel=3 --output-style=stream --verbose

      - name: Build apps
        run: |
          set -euo pipefail
          for app in apps/*; do
            if [ -d "$app" ]; then
              echo "Building $app"
              pnpm --dir "$app" run build
            fi
          done
