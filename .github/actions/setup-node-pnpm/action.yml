name: Setup Node and pnpm

description: Setup pnpm, setup Node.js, restore caches, and install dependencies.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/setup@v2
      with:
        version: '11.22.0'
        install: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
